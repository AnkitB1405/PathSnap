<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PathSnap Evaluator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --line: #dde2e7; --text: #1b2430; --muted: #66727f;
    --accent: #1f6feb; --accent-soft: #e8f0fe; --good: #1a7f37; --warn: #b26a00; --bad: #c62828;
    --gps: #1f6feb; --hmm: #d62828; --clf: #f08c00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: var(--panel);
           border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 18px; }
  .brand span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .api { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .api input { width: 240px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #aaa; }
  .dot.ok { background: var(--good); } .dot.err { background: var(--bad); }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line);
           background: var(--panel); padding: 7px 12px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; display: grid; grid-template-columns: 290px 1fr 360px; min-height: 0; }
  aside, section.results { background: var(--panel); overflow-y: auto; padding: 14px; }
  aside { border-right: 1px solid var(--line); }
  section.results { border-left: 1px solid var(--line); }
  h3 { margin: 4px 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
  .seg button { flex: 1; border: 0; border-radius: 0; padding: 8px 6px; font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .seg small { display: block; color: var(--muted); font-weight: 400; }
  .trip { display: flex; align-items: center; width: 100%; margin-bottom: 6px; padding: 9px 10px; text-align: left; }
  .trip .id { font-weight: 600; }
  .trip .pts { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .trip .acc { margin-left: auto; font-size: 12px; font-weight: 600; }
  .trip.on { border-color: var(--accent); background: var(--accent-soft); }
  .runall { width: 100%; margin-top: 8px; }
  #mapwrap { position: relative; min-height: 300px; }
  #map { position: absolute; inset: 0; }
  #busy { position: absolute; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center;
          background: rgba(255,255,255,.6); font-weight: 600; }
  #busy.on { display: flex; }
  .spin { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent);
          border-radius: 50%; animation: s 0.8s linear infinite; margin-right: 10px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .kpi { border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .kpi b { display: block; font-size: 22px; }
  .kpi span { color: var(--muted); font-size: 12px; }
  .kpi small { color: var(--muted); font-size: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-bottom: 14px; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: left; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .up { color: var(--good); } .down { color: var(--bad); }
  .empty { color: var(--muted); padding: 20px 4px; }
  .msg { font-size: 13px; color: var(--muted); margin: 8px 0; min-height: 18px; }
  .msg.err { color: var(--bad); }
  .legend { background: #fff; padding: 7px 10px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.25);
            font-size: 12px; line-height: 1.7; }
  .legend i { display: inline-block; width: 18px; height: 4px; margin-right: 6px; vertical-align: middle; }
  .legend i.d { width: 8px; height: 8px; border-radius: 50%; }
  @media (max-width: 1000px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 420px auto; }
    aside, section.results { border: 0; border-bottom: 1px solid var(--line); }
    .api { margin-left: 0; width: 100%; } .api input { flex: 1; width: auto; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">PathSnap<span>GPS map-matching and route reconstruction</span></div>
  <div class="api">
    <div class="dot" id="dot" title="API status"></div>
    <input id="api" value="http://localhost:8000" aria-label="API address">
    <button class="primary" onclick="connect()">Connect</button>
  </div>
</header>
<main>
  <aside>
    <h3>Test set</h3>
    <div class="seg" id="sets"><div class="empty">Not connected</div></div>
    <h3>Trips</h3>
    <div id="trips"></div>
    <button class="runall" id="runall" onclick="runAll()" disabled>Run all trips in this set</button>
    <div class="msg" id="msg"></div>
  </aside>
  <div id="mapwrap"><div id="map"></div><div id="busy"><div class="spin"></div><span id="busytxt">Running</span></div></div>
  <section class="results" id="results"><div class="empty">Pick a test set and a trip to see the predicted route and accuracy.</div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const pct = x => (100 * x).toFixed(2) + ' %';
const state = { set: null, trip: null, done: {} };

const map = L.map('map', { preferCanvas: true }).setView([50, 10], 4);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
const layers = { gps: L.layerGroup(), hmm: L.layerGroup(), clf: L.layerGroup(), ends: L.layerGroup() };
layers.gps.addTo(map); layers.clf.addTo(map); layers.hmm.addTo(map); layers.ends.addTo(map);
L.control.layers(null, { 'GPS observations': layers.gps, 'Predicted route (classifier + HMM)': layers.hmm,
  'Classifier only': layers.clf, 'Start / end': layers.ends }, { collapsed: false }).addTo(map);
const legend = L.control({ position: 'bottomleft' });
legend.onAdd = () => { const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = '<i class="d" style="background:var(--gps)"></i>GPS observations<br>' +
    '<i style="background:var(--hmm)"></i>Predicted route (classifier + HMM)<br>' +
    '<i style="background:var(--clf)"></i>Classifier only'; return d; };
legend.addTo(map);

const api = () => $('api').value.trim().replace(/\/$/, '');
const msg = (t, err) => { $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); };
const busy = (on, t) => { $('busy').className = on ? 'on' : ''; if (t) $('busytxt').textContent = t; };
async function get(path, opts) {
  const r = await fetch(api() + path, opts);
  if (!r.ok) throw new Error(r.status + ' ' + await r.text());
  return r.json();
}

async function connect() {
  try {
    const r = await get('/sets');
    $('dot').className = 'dot ok';
    $('sets').innerHTML = '';
    r.sets.forEach(s => {
      const b = document.createElement('button');
      b.dataset.set = s.name;
      b.innerHTML = s.name.replace('_', ' ') + `<small>${s.n_trips} trips</small>`;
      b.onclick = () => pickSet(s.name);
      $('sets').appendChild(b);
    });
    const want = new URLSearchParams(location.search).get('set');
    await pickSet(r.sets.some(s => s.name === want) ? want : r.sets[0].name);
  } catch (e) { $('dot').className = 'dot err'; msg('Could not reach the API: ' + e.message, true); }
}

async function pickSet(name) {
  state.set = name; state.trip = null; state.done = {};
  document.querySelectorAll('#sets button').forEach(b => b.classList.toggle('on', b.dataset.set === name));
  const r = await get('/trips?set=' + encodeURIComponent(name));
  $('trips').innerHTML = '';
  r.trips.forEach(id => {
    const b = document.createElement('button');
    b.className = 'trip'; b.dataset.id = id;
    b.innerHTML = `<span class="id">Trip ${id}</span><span class="pts">${r.points[id]} pts</span><span class="acc"></span>`;
    b.onclick = () => run(id);
    $('trips').appendChild(b);
  });
  $('runall').disabled = false;
  $('results').innerHTML = '<div class="empty">Pick a trip to see the predicted route and accuracy.</div>';
  Object.values(layers).forEach(l => l.clearLayers());
  msg(r.trips.length + ' trips in ' + name);
}

function markTrip(id, acc) {
  const b = document.querySelector(`.trip[data-id="${id}"]`);
  if (!b) return;
  if (acc !== undefined) {
    const a = b.querySelector('.acc');
    a.textContent = pct(acc); a.style.color = acc >= 0.9 ? 'var(--good)' : acc >= 0.8 ? 'var(--warn)' : 'var(--bad)';
  }
}

async function predict(id) {
  const r = await get('/predict', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ trip_id: id, set: state.set }) });
  state.done[id] = r;
  markTrip(id, r.metrics.classifier_hmm.point_accuracy);
  return r;
}

async function run(id) {
  state.trip = id;
  document.querySelectorAll('.trip').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  busy(true, 'Running trip ' + id + ' ...');
  try {
    const r = state.done[id] || await predict(id);
    draw(r); show(r); msg('Trip ' + id + ' done');
  } catch (e) { msg('Error: ' + e.message, true); }
  busy(false);
}

function draw(r) {
  Object.values(layers).forEach(l => l.clearLayers());
  r.gps.forEach(p => L.circleMarker(p, { radius: 2, color: '#1f6feb', weight: 0, fillOpacity: .5 }).addTo(layers.gps));
  L.polyline(r.classifier_route || [], { color: '#f08c00', weight: 7, opacity: .7 }).addTo(layers.clf);
  L.polyline(r.predicted_route, { color: '#d62828', weight: 4 }).addTo(layers.hmm);
  L.circleMarker(r.gps[0], { radius: 7, color: '#fff', weight: 2, fillColor: '#1a7f37', fillOpacity: 1 })
    .bindTooltip('Start').addTo(layers.ends);
  L.circleMarker(r.gps[r.gps.length - 1], { radius: 7, color: '#fff', weight: 2, fillColor: '#1b2430', fillOpacity: 1 })
    .bindTooltip('End').addTo(layers.ends);
  map.fitBounds(L.latLngBounds(r.gps), { padding: [20, 20] });
}

function show(r) {
  const h = r.metrics.classifier_hmm, c = r.metrics.classifier_only;
  const diff = (a, b) => { const d = 100 * (a - b); const cls = d > 0.005 ? 'up' : d < -0.005 ? 'down' : '';
    return `<td class="n ${cls}">${d >= 0 ? '+' : ''}${d.toFixed(2)}</td>`; };
  const row = (n, k) => `<tr><td>${n}</td><td class="n">${pct(h[k])}</td><td class="n">${pct(c[k])}</td>${diff(h[k], c[k])}</tr>`;
  $('results').innerHTML = `
    <h3>Trip ${r.trip_id} &middot; ${r.set.replace('_', ' ')}</h3>
    <div class="kpis">
      <div class="kpi"><span>Point accuracy</span><b>${pct(h.point_accuracy)}</b><small>classifier only ${pct(c.point_accuracy)}</small></div>
      <div class="kpi"><span>Route F1</span><b>${pct(h.route_f1)}</b><small>classifier only ${pct(c.route_f1)}</small></div>
      <div class="kpi"><span>Route continuity</span><b>${pct(h.route_continuity)}</b><small>classifier only ${pct(c.route_continuity)}</small></div>
      <div class="kpi"><span>Inference time</span><b>${r.inference_time_s.toFixed(2)} s</b><small>${r.n_points} GPS points</small></div>
    </div>
    <h3>Classifier + HMM vs classifier only</h3>
    <table><tr><th></th><th class="n">+ HMM</th><th class="n">Classifier</th><th class="n">Diff (pts)</th></tr>
      ${row('Point accuracy', 'point_accuracy')}${row('Route continuity', 'route_continuity')}
      ${row('Route precision', 'route_precision')}${row('Route recall', 'route_recall')}${row('Route F1', 'route_f1')}
    </table>
    <h3>Details</h3>
    <table>
      <tr><td>GPS points</td><td class="n">${r.n_points}</td></tr>
      <tr><td>Predicted road segments</td><td class="n">${r.predicted_route.length}</td></tr>
      <tr><td>Chain breaks (gaps / no path)</td><td class="n">${r.chain_breaks}</td></tr>
    </table>
    ${summary()}`;
}

function summary() {
  const done = Object.values(state.done);
  if (done.length < 2) return '';
  let pts = 0, ok = 0, okc = 0;
  const rows = done.sort((a, b) => a.trip_id.localeCompare(b.trip_id)).map(r => {
    const h = r.metrics.classifier_hmm, c = r.metrics.classifier_only;
    pts += r.n_points; ok += h.point_accuracy * r.n_points; okc += c.point_accuracy * r.n_points;
    return `<tr><td>${r.trip_id}</td><td class="n">${r.n_points}</td><td class="n">${pct(h.point_accuracy)}</td><td class="n">${pct(c.point_accuracy)}</td><td class="n">${pct(h.route_f1)}</td></tr>`;
  }).join('');
  return `<h3>All trips run so far (${done.length})</h3>
    <table><tr><th>Trip</th><th class="n">Pts</th><th class="n">+ HMM</th><th class="n">Clf</th><th class="n">Route F1</th></tr>${rows}
    <tr><th>Overall</th><th class="n">${pts}</th><th class="n">${pct(ok / pts)}</th><th class="n">${pct(okc / pts)}</th><th></th></tr></table>`;
}

async function runAll() {
  const ids = [...document.querySelectorAll('.trip')].map(b => b.dataset.id);
  $('runall').disabled = true;
  try {
    for (const [i, id] of ids.entries()) {
      busy(true, `Running trip ${id} (${i + 1} / ${ids.length}) ...`);
      if (!state.done[id]) await predict(id);
    }
    const last = state.done[state.trip] || state.done[ids[ids.length - 1]];
    document.querySelectorAll('.trip').forEach(b => b.classList.toggle('on', b.dataset.id === last.trip_id));
    draw(last); show(last); msg('All ' + ids.length + ' trips done');
  } catch (e) { msg('Error: ' + e.message, true); }
  busy(false); $('runall').disabled = false;
}

// optional: index.html?api=http://host:8000&set=evaluator_test&trip=00000015
const q = new URLSearchParams(location.search);
if (q.get('api')) $('api').value = q.get('api');
connect().then(() => { if (q.get('trip')) run(q.get('trip')); });
</script>
</body>
</html>
